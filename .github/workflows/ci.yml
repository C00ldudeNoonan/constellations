name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --all-extras --dev --locked
      - name: Dependency audit
        run: uv run pip-audit --skip-editable
      - name: Ruff
        run: uv run ruff check
      - name: Ty
        run: uv run ty check
      # One worker per core, files kept together: a file's fixtures and any
      # within-file ordering stay as they are on a serial run, and process-global
      # state is per worker. Measured 248s -> 90s on four cores (issue #603).
      - name: Pytest
        run: uv run pytest -q -n auto --dist loadfile --junitxml=target/ci/junit.xml
      # Per-test results, run over run: what turns an order-dependent or flaky
      # test from an anecdote into a history.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci/junit.xml
          retention-days: 30

  latest-anthropic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync locked project dependencies
        run: uv sync --all-extras --dev --locked
      # Overlay the current SDK without replacing the reproducible lock.
      - name: Provider contracts with latest Anthropic
        run: >-
          uv run --locked --with 'anthropic>=2'
          pytest -q tests/test_anthropic_provider.py tests/test_provider_contracts.py
          tests/test_llm_backend.py tests/test_backend_options.py tests/test_llm_map.py
          tests/test_llm_model.py

  latest-warehouse-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync locked project dependencies
        run: uv sync --all-extras --dev --locked
      # An isolated overlay exercises the newest allowed drivers without
      # churning uv.lock or changing the primary reproducible test job.
      - name: Pytest with latest DuckDB and Polars
        run: >-
          uv run --locked --with 'duckdb>=2' --with 'polars>=2'
          pytest -q -n auto --dist loadfile
          -W 'error:Arrow output on a DB-API result makes an extra copy:UserWarning'
