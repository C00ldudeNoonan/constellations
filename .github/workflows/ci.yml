name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --all-extras --dev --locked
      - name: Dependency audit
        run: uv run pip-audit --skip-editable
      - name: Ruff
        run: uv run ruff check
      - name: Ty
        run: uv run ty check
      # One worker per core, files kept together: a file's fixtures and any
      # within-file ordering stay as they are on a serial run, and process-global
      # state is per worker. Measured 248s -> 90s on four cores (issue #603).
      - name: Pytest
        run: uv run pytest -q -n auto --dist loadfile --junitxml=target/ci/junit.xml
      # Per-test results, run over run: what turns an order-dependent or flaky
      # test from an anecdote into a history.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci/junit.xml
          retention-days: 30
