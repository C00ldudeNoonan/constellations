[project]
name = "dbt-ml"
version = "0.8.1"
description = "Renamed to Constellations, installed as `stel`. This is a redirect."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = ["stel>=0.9.0"]

[project.urls]
Homepage = "https://github.com/C00ldudeNoonan/constellations"
Repository = "https://github.com/C00ldudeNoonan/constellations"
Changelog = "https://github.com/C00ldudeNoonan/constellations/blob/master/stel/CHANGELOG.md"

# 0.8.0 shipped a `dbt-ml` console script. Dropping it outright would make the
# command vanish with no explanation; this one exists only to say where it went.
[project.scripts]
dbt-ml = "dbt_ml:_redirect_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_ml"]
