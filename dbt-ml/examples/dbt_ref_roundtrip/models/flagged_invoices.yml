version: 2

models:
  - name: flagged_invoices
    description: >
      Reads the dbt-built mart `invoice_facts` (itself built from the dbt-ml
      extraction model `raw_vendors`) back into dbt-ml — the reverse
      (dbt -> dbt-ml) half of the round trip: dbt-ml feeds dbt, and dbt feeds
      back into a dbt-ml transform, all in one `dbt build` (#177).
    source: dbt_ref('invoice_facts')
    materialization: full
    transform:
      type: python
      module: transforms.flag_high_value
    tags: [dbt_ref, roundtrip]

    fields:
      - name: vendor
        data_type: string
      - name: total_spend
        data_type: float
      - name: flagged
        data_type: boolean

    tests:
      - not_null: [vendor, total_spend, flagged]
      - unique: vendor
