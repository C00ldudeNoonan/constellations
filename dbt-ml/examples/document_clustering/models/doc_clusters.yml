version: 2
models:
  - name: doc_clusters
    description: "K-means clusters over TF-IDF features (+ representative docs)"
    depends_on: [ref('doc_tfidf')]
    ml:
      task: cluster
      mode: fit_transform
      provider: builtin.kmeans
      artifact:
        path: target/artifacts/doc_clusters
      metrics: [n_clusters, silhouette, inertia]
      options:
        n_clusters: 3
        normalize: l2
        representative_docs: 2
        # c-TF-IDF top terms per cluster -> doc_clusters__topics
        top_terms: 5
        # per-document nearest neighbors -> doc_clusters__neighbors
        nearest_neighbors: 3
        random_state: 0
    materialization: full
    tags: [cluster, classic_ml]
