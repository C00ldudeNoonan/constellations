version: 2

models:
  - name: entity_links
    description: "Long-form mention-to-canonical-ID link table with explicit statuses"
    depends_on: [ref('entity_mentions'), ref('entity_aliases')]
    transform:
      type: python
      module: dbt_ml.text.transforms.link_entities
      options:
        mentions: entity_mentions
        aliases: entity_aliases
        document_id_field: source_document_id
        start_field: null
        end_field: null
    materialization: full
    tags: [economic_data, entity_links]
    tests:
      - not_null: [entity_link_id, mention_id, document_id, status, resolver,
                   resolver_version, alias_set_version]
      - unique: entity_link_id
      - accepted_values:
          column: status
          values: [matched, ambiguous, unmatched]
