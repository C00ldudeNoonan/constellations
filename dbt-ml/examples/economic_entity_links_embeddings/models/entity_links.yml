version: 2

models:
  - name: entity_links
    description: "Long-form mention-to-canonical-ID links resolved by vector similarity"
    depends_on: [ref('mention_embeddings'), ref('alias_embeddings')]
    transform:
      type: python
      module: dbt_ml.text.transforms.link_entities
      options:
        resolver: vector_similarity
        mentions: mention_embeddings
        aliases: alias_embeddings
        document_id_field: source_document_id
        mention_vector_field: embedding
        alias_vector_field: embedding
        metric: cosine
        # Deterministic embeddings give identical text an identical vector, so a
        # high bar accepts only same-surface-form matches in this offline demo.
        threshold: 0.999
        start_field: null
        end_field: null
    materialization: full
    tags: [economic_data, entity_links]
    tests:
      - not_null: [entity_link_id, mention_id, document_id, status, resolver,
                   resolver_version, alias_set_version]
      - unique: entity_link_id
      - accepted_values:
          column: status
          values: [matched, ambiguous, unmatched]
