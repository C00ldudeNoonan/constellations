version: 2

models:
  - name: document_features
    description: "One analysis-ready row per document over the NLP child tables"
    depends_on:
      [
        ref('document_tokens'),
        ref('document_entities'),
        ref('entity_links'),
        ref('raw_documents'),
      ]
    transform:
      type: python
      module: dbt_ml.text.transforms.nlp_document_features
      options:
        tokens: document_tokens
        entities: document_entities
        links: entity_links
        documents: raw_documents
        documents_id_field: economic_id
        pos_counts: [NOUN, PROPN, VERB]
        pos_ratios: [PROPN]
        entity_label_counts: [ORG, GPE, DATE]
        link_namespace_counts: [agency, iso3166]
        link_status_counts: [matched, ambiguous, unmatched]
        include_fields: [publisher, published_at]
    materialization: full
    tags: [economic_data, nlp, features]
    tests:
      - not_null: [document_id, token_count, entity_count]
      - unique: document_id
      - accepted_range:
          column: lexical_diversity
          min: 0.0
          max: 1.0
      - accepted_range:
          column: stop_ratio
          min: 0.0
          max: 1.0
      - relationships:
          column: document_id
          to: ref('raw_documents')
          field: economic_id
