version: 2

models:
  - name: document_relations
    description: "Co-occurrence relations between entity mentions in a sentence"
    depends_on: [ref('document_entities')]
    transform:
      type: python
      module: dbt_ml.text.transforms.extract_relations
      options:
        mentions: document_entities
        # `document_entities` withholds matched text, so relations pair on
        # offsets only and record no evidence text — labelled co_occurrence,
        # never a semantic assertion.
        scope: sentence
        relation_type: co_occurs_with
    # Incremental (#218): parents are documents in `document_entities`; a changed
    # document re-derives exactly its relation rows, keyed by `relation_id`.
    materialization: incremental
    tags: [economic_data, nlp, relations]
    tests:
      - not_null:
          [relation_id, document_id, subject_mention_id, object_mention_id,
           relation_type, method, status, extractor, extractor_version]
      - unique: relation_id
      - accepted_values:
          column: status
          values: [asserted, ambiguous, no_relation]
      - accepted_values:
          column: method
          values: [co_occurrence, rule, model_assertion]
