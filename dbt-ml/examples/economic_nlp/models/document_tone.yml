version: 2

models:
  - name: document_tone
    description: "Deterministic per-document tone from the token table and lexicon"
    depends_on: [ref('document_tokens'), ref('tone_lexicon')]
    transform:
      type: python
      module: dbt_ml.text.transforms.document_tone
      options:
        tokens: document_tokens
        lexicon: tone_lexicon
        document_id_field: document_id
        match_field: lemma
        language: en
        emit: [positive, negative, uncertainty, dovish]
        include_fields: [publisher, published_at]
    materialization: full
    tags: [economic_data, tone]
    tests:
      - not_null: [document_id, token_count, status, scorer, lexicon_version]
      - accepted_values:
          column: status
          values: [scored, insufficient_text]
      - relationships:
          column: document_id
          to: ref('raw_documents')
          field: economic_id
