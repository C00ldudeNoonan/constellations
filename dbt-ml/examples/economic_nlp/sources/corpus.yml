version: 2

sources:
  - name: economic_documents
    description: "Small committed corpus of synthetic economic-policy documents"
    path: corpus
    file_pattern: "*.json"
    recursive: true
    tags: [economic_data, documents]
  - name: economic_aliases
    description: "Operator-owned aliases for economic institutions and places"
    path: aliases
    file_pattern: "*.json"
    tags: [economic_data, aliases]
  - name: economic_tone_lexicon
    description: "Operator-owned economic tone lexicon (term, category, weight)"
    path: lexicon
    file_pattern: "*.json"
    tags: [economic_data, tone]
