version: 2

models:
  - name: document_chunks
    description: "Citable governed policy passages"
    depends_on: [ref('document_registry')]
    transform:
      type: python
      module: transforms.document_chunks
    agent_context:
      contract: agent_context/v1
      grain: document_chunks
    materialization: full
    fields:
      - {name: title, data_type: string}
      - {name: source_version, data_type: string}
      - {name: customer_segment, data_type: string}
      - {name: effective_date, data_type: string}
    tests:
      - not_null: [context_id, chunk_id, document_version_id, text]
      - unique: context_id
