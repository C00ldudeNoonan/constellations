version: 2

# Fan-out `llm:` model (output_cardinality: many): one provider call per chunk
# yields a list of rows. Each output row gets a deterministic `llm_row_id`
# (f"{chunk_id}__{ordinal}") as its primary key and keeps `chunk_id` so a
# changed or deleted parent chunk cleanly replaces or removes its whole set of
# rows on incremental runs.
models:
  - name: chunk_entities
    description: "Named entities per chunk, one row each (output_cardinality: many)"
    depends_on: [ref('document_chunks')]

    llm:
      mode: map
      input_field: text
      id_field: chunk_id
      output_cardinality: many
      prompt: >
        List each distinct named entity mentioned in this passage, with its
        type (person, organization, place, policy, or other).
      provider: deterministic
      model: deterministic-v1

    fields:
      - name: entity
        data_type: string
      - name: entity_type
        data_type: string

    materialization: incremental

    tests:
      - not_null: [llm_row_id, chunk_id]
      - unique: llm_row_id
