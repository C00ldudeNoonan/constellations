version: 2

models:
  - name: chunk_search
    description: "Public local search index over the example document chunks"
    depends_on: [ref('chunk_embeddings')]
    materialization: incremental
    tags: [retrieval, rag]

    search:
      access: public
      store: local
      collection: document_chunks
      id_field: chunk_id
      document_id_field: document_id
      chunk_id_field: chunk_id
      text_fields: [text]
      return_text_fields: [text]
      vector:
        field: embedding
        dimensions: 8
        metric: cosine
        search: exact
        embedding: inherit
      full_text:
        fields: [text]
      attributes:
        - name: source_uri
          data_type: string
          filter_role: user
          returned: true
      query:
        modes: [vector, text, filter]
        consistency: strong
      on_index_change: fail
      batch_size: 100
