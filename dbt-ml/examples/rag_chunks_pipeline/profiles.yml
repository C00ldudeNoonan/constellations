rag_chunks_pipeline:
  target: dev
  outputs:
    dev:
      warehouse:
        type: duckdb
        path: ./target/dbt_ml.duckdb
        schema: rag
      retrieval:
        default: local
        allow_public_indexes: true
        stores:
          local:
            type: lancedb
            path: ./target/lancedb
          # A cloud-backed store shares one index across the machine that runs
          # `dbt-ml build` and the machines that serve it (MCP server, search
          # API). lancedb connects to s3://, gs://, and az:// natively; a cloud
          # `path` skips local-path resolution and passes straight through.
          # Uncomment and set `default: cloud` to use it.
          # cloud:
          #   type: lancedb
          #   path: gs://my-bucket/dbt-ml/lancedb
          #   storage_options:
          #     # Credentials/region for the object store, forwarded to
          #     # lancedb.connect(storage_options=...). Held as secrets: kept in
          #     # this operator-controlled profile, redacted from config dumps,
          #     # and never written to artifacts/logs.
          #     google_service_account: /run/secrets/gcs-sa.json
          #   # The single-host publisher lock has no local disk to live on for a
          #   # cloud store, so it defaults to a fixed per-machine directory. If
          #   # your publishers run in separate containers, point this at a volume
          #   # mounted into every one of them so they actually share the lock.
          #   # publisher_lock_dir: /var/run/dbt-ml/lancedb-locks
