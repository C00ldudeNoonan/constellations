[project]
name = "dbt-ml"
version = "0.2.9"
description = "dbt for unstructured data — declarative pipelines for documents, text, and ML preprocessing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "pydantic>=2.7",
    "pyyaml>=6",
    "duckdb>=1.0",
    "polars>=1.0",
    "pyarrow>=16",
    "faker>=25",
    "anthropic>=0.40",
    "watchfiles>=0.21",
    "jinja2>=3.1",
    "cryptography>=48.0.1",
]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.25"]
gcs = ["google-cloud-storage>=2.16"]
lancedb = ["lancedb>=0.34,<0.35"]
mcp = ["mcp>=1.27,<2"]
html = ["beautifulsoup4>=4.12"]
pdf = ["pypdf>=6.13.0", "fpdf2>=2.7"]
pii = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
text = ["tiktoken>=0.7", "ftfy>=6.2", "langdetect>=1.0", "datasketch>=1.6"]
# scikit-learn>=1.3 ships HDBSCAN natively, so clustering/topic modeling needs
# no separate hdbscan dependency.
ml = ["scikit-learn>=1.3", "numpy>=1.26"]
all = [
    "google-cloud-bigquery>=3.25",
    "google-cloud-storage>=2.16",
    "lancedb>=0.34,<0.35",
    "mcp>=1.27,<2",
    "beautifulsoup4>=4.12",
    "pypdf>=6.13.0",
    "fpdf2>=2.7",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "tiktoken>=0.7",
    "ftfy>=6.2",
    "langdetect>=1.0",
    "datasketch>=1.6",
    "scikit-learn>=1.3",
    "numpy>=1.26",
]

[project.scripts]
dbt-ml = "dbt_ml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_ml"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "types-pyyaml",
    # the bigquery/gcs extras, so adapter unit tests run against real client types
    "google-cloud-bigquery>=3.25",
    "google-cloud-storage>=2.16",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
# Legitimate Unicode (right single quote, em dash, smart quotes) in docstrings,
# tests, and examples isn't a typo — we deliberately use it for mojibake demos.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/dbt_ml"]

[[tool.mypy.overrides]]
module = ["datasketch", "langdetect"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
