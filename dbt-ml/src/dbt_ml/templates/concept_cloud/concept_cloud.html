<!DOCTYPE html>
<!-- GENERATED by `dbt-ml concept-cloud` (#255). Self-contained: the export
     bundle is embedded below; the 3d-force-graph library loads from a CDN the
     first time the page is viewed (needs network then), degrading to a message
     if unreachable. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dbt-ml concept cloud</title>
  <style>
    :root {
      --bg: #0b0f17; --panel: #131a26; --fg: #e6edf3; --muted: #8b98a9;
      --accent: #58a6ff; --edge: #33415580; --beam: #f0b429;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #graph { position: fixed; inset: 0; }
    header { position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; gap: 16px; align-items: center; padding: 10px 16px;
      background: linear-gradient(var(--bg), transparent); }
    header h1 { font-size: 15px; font-weight: 600; margin: 0; }
    header h1 small { color: var(--muted); font-weight: 400; }
    #search { background: var(--panel); border: 1px solid #263141; color: var(--fg);
      border-radius: 6px; padding: 6px 10px; width: 240px; }
    #panel { position: fixed; top: 52px; left: 16px; z-index: 10; max-width: 260px;
      background: var(--panel); border: 1px solid #263141; border-radius: 8px;
      padding: 10px 12px; }
    #panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
      color: var(--muted); margin: 0 0 6px; }
    .legend-item { display: flex; align-items: center; gap: 8px; margin: 3px 0;
      cursor: pointer; user-select: none; }
    .swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; }
    .legend-item.off { opacity: .35; }
    #detail { position: fixed; bottom: 16px; left: 16px; z-index: 10; max-width: 320px;
      background: var(--panel); border: 1px solid #263141; border-radius: 8px;
      padding: 10px 12px; display: none; }
    #detail .k { color: var(--muted); }
    footer { position: fixed; bottom: 8px; right: 12px; z-index: 10;
      color: var(--muted); font-size: 11px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>dbt-ml concept cloud <small id="subtitle"></small></h1>
    <input id="search" type="search" placeholder="Search concepts…" autocomplete="off" />
  </header>
  <aside id="panel">
    <h2>Entity types</h2>
    <div id="legend"></div>
  </aside>
  <aside id="detail"></aside>
  <div id="graph"></div>
  <footer>drag to orbit · scroll to zoom · click a node to trace beams</footer>

  <script id="cc-data" type="application/json">__CONCEPT_CLOUD_DATA__</script>
  <script>
    "use strict";
    const CDN = "https://unpkg.com/3d-force-graph";
    const DATA = JSON.parse(document.getElementById("cc-data").textContent);
    document.getElementById("subtitle").textContent =
      "· " + DATA.project + " · " + DATA.concepts.length + " concepts";

    // Categorical palette for entity labels (color-by-type). Stable per label.
    const PALETTE = ["#58a6ff","#f0b429","#7ee787","#ff7b72","#d2a8ff",
                     "#ffa657","#79c0ff","#ff9bce","#56d4bc","#e3b341"];
    const labels = [...new Set(DATA.concepts.map(c => c.label || "—"))].sort();
    const colorForLabel = {};
    labels.forEach((l, i) => colorForLabel[l] = PALETTE[i % PALETTE.length]);
    const RESOURCE_COLOR = { source: "#8b98a9", model: "#3fb950", exposure: "#d2a8ff" };

    const hidden = new Set();   // labels toggled off
    let selected = null;        // currently selected node id
    let Graph = null;           // assigned once the library loads

    // The library-independent UI (subtitle, legend) renders immediately; the
    // 3d-force-graph library loads non-blockingly so a slow/unreachable CDN
    // degrades to a message instead of hanging or blanking the page.
    buildLegend();
    loadForceGraph().then(buildGraph).catch(() => showFallback(
      "Couldn't load the 3d-force-graph library (the artifact fetches it from a " +
      "CDN on first view — this needs network). Entity types are listed on the left."
    ));

    function loadForceGraph() {
      return new Promise((resolve, reject) => {
        if (typeof ForceGraph3D !== "undefined") return resolve();
        const s = document.createElement("script");
        s.src = CDN;
        s.onload = () => typeof ForceGraph3D !== "undefined"
          ? resolve() : reject(new Error("missing global"));
        s.onerror = () => reject(new Error("network"));
        document.head.appendChild(s);
        setTimeout(() =>
          typeof ForceGraph3D === "undefined" && reject(new Error("timeout")), 10000);
      });
    }

    function showFallback(msg) {
      document.getElementById("graph").innerHTML =
        '<div style="max-width:520px;margin:22vh auto;padding:0 24px;' +
        'color:var(--muted);text-align:center;line-height:1.6">' + msg + "</div>";
    }

    function buildLegend() {
      const legend = document.getElementById("legend");
      labels.forEach(l => {
        const row = document.createElement("div");
        row.className = "legend-item";
        row.innerHTML =
          `<span class="swatch" style="background:${colorForLabel[l]}"></span>${l}`;
        row.onclick = () => {
          if (hidden.has(l)) hidden.delete(l); else hidden.add(l);
          row.classList.toggle("off", hidden.has(l));
          if (Graph) Graph.nodeVisibility(Graph.nodeVisibility());
        };
        legend.appendChild(row);
      });
    }

    function showDetail(node) {
      const el = document.getElementById("detail");
      if (!node) { el.style.display = "none"; return; }
      el.style.display = "block";
      if (node.kind === "concept") {
        el.innerHTML = `<strong>${node.name}</strong><br>` +
          `<span class="k">id</span> ${node.id}<br>` +
          `<span class="k">type</span> ${node.label} · ` +
          `<span class="k">freq</span> ${node.frequency} · ` +
          `<span class="k">link</span> ${node.link_status}`;
      } else {
        el.innerHTML = `<strong>${node.name}</strong><br>` +
          `<span class="k">dbt ${node.resource_type}</span><br>${node.id}`;
      }
    }

    function buildGraph() {
      // Build one graph: fixed DAG-plane nodes (z=0 grid) + floating concept nodes.
      const nodes = [];
      const links = [];
      const dagNodes = DATA.dag_plane.nodes;
      const cols = Math.max(1, Math.ceil(Math.sqrt(dagNodes.length)));
      const SPREAD = 60;
      dagNodes.forEach((n, i) => nodes.push({
        id: n.id, name: n.label, kind: "dag", resource_type: n.resource_type, val: 6,
        fx: (i % cols - cols / 2) * SPREAD, fz: (Math.floor(i / cols) - cols / 2) * SPREAD,
        fy: 0,
      }));
      DATA.dag_plane.edges.forEach(e =>
        links.push({ source: e.from, target: e.to, kind: "dag" }));
      DATA.concepts.forEach(c => nodes.push({
        id: c.canonical_id, name: c.display, kind: "concept", label: c.label || "—",
        val: c.frequency, link_status: c.link_status, frequency: c.frequency,
        y: 40 + Math.random() * 60,
      }));
      DATA.concept_edges.forEach(e => links.push({
        source: e.source, target: e.target, kind: "concept",
        relation_type: e.relation_type, method: e.method, directed: e.directed,
      }));
      DATA.cross_layer_edges.forEach(e => links.push({
        source: e.concept, target: e.dag_node, kind: "cross",
      }));

      const neighbors = new Map();
      links.forEach(l => {
        (neighbors.get(l.source) || neighbors.set(l.source, new Set()).get(l.source)).add(l.target);
        (neighbors.get(l.target) || neighbors.set(l.target, new Set()).get(l.target)).add(l.source);
      });
      const linkKey = l => (l.source.id ?? l.source) + " " + (l.target.id ?? l.target);
      const touching = new Set();
      function recomputeTouching() {
        touching.clear();
        if (!selected) return;
        links.forEach(l => {
          const s = l.source.id ?? l.source, t = l.target.id ?? l.target;
          if (s === selected || t === selected) touching.add(linkKey(l));
        });
      }
      function refresh() {
        Graph.nodeColor(Graph.nodeColor()).linkVisibility(Graph.linkVisibility())
             .linkColor(Graph.linkColor()).linkDirectionalParticles(Graph.linkDirectionalParticles());
      }

      Graph = ForceGraph3D()(document.getElementById("graph"))
        .backgroundColor("#0b0f17")
        .graphData({ nodes, links })
        .nodeLabel(n => n.kind === "concept"
          ? `${n.name} · ${n.label} · freq ${n.frequency}`
          : `${n.name} · ${n.resource_type}`)
        .nodeVal(n => n.kind === "dag" ? 6 : Math.max(2, n.val))
        .nodeVisibility(n => n.kind === "dag" || !hidden.has(n.label))
        .nodeColor(n => {
          const base = n.kind === "dag"
            ? (RESOURCE_COLOR[n.resource_type] || "#8b98a9") : colorForLabel[n.label];
          if (!selected) return base;
          if (n.id === selected || (neighbors.get(selected) || new Set()).has(n.id))
            return base;
          return "#2b3644";
        })
        .linkVisibility(l => l.kind === "cross"
          ? (selected ? touching.has(linkKey(l)) : false) : true)
        .linkColor(l => {
          if (l.kind === "cross") return "#f0b429";
          if (l.kind === "dag") return "#33415580";
          return selected && !touching.has(linkKey(l)) ? "#2b364480" : "#7ee78780";
        })
        .linkWidth(l => l.kind === "cross" ? 1.5 : (l.kind === "concept" ? 0.6 : 0.4))
        .linkDirectionalArrowLength(l => l.kind === "concept" && l.directed ? 3 : 0)
        .linkDirectionalParticles(l =>
          l.kind === "cross" && touching.has(linkKey(l)) ? 3 : 0)
        .onNodeClick(node => {
          selected = (selected === node.id) ? null : node.id;
          recomputeTouching(); showDetail(selected ? node : null); refresh();
        })
        .onBackgroundClick(() => {
          selected = null; recomputeTouching(); showDetail(null); refresh();
        });

      document.getElementById("search").addEventListener("input", e => {
        const q = e.target.value.trim().toLowerCase();
        if (!q) { selected = null; recomputeTouching(); showDetail(null); refresh(); return; }
        const hit = nodes.find(n => n.kind === "concept" &&
          (n.name.toLowerCase().includes(q) || n.id.toLowerCase().includes(q)));
        if (hit) {
          selected = hit.id; recomputeTouching(); showDetail(hit);
          if (hit.x !== undefined)
            Graph.cameraPosition({ x: hit.x, y: hit.y + 30, z: hit.z + 80 }, hit, 600);
          refresh();
        }
      });
    }
  </script>
</body>
</html>
