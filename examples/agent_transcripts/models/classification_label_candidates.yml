version: 2

# #329 phase 3, the `eval:` half (issue #456). Three models, and the split is
# the point: the mechanical shaping is a built-in transform, the judgement is
# an ordinary `llm:` model, and the contract `eval.expected` reads is a SQL
# transform over the two. No new model kind — #329 rule 3.
#
# Candidates a human promotes, never goldens. Nothing here is read by `eval:`
# and nothing promotes itself at any confidence (#329 rule 2).
models:
  # 1. One row per *pair* of consecutive exchanges: the agent's claim and the
  #    human turn that may correct it. A correction lands in the next prompt,
  #    and the records behind the claim were retrieved by the earlier
  #    exchange, so both halves have to travel together. The ids are the
  #    constraint: a correction has to attach to a record to be ground truth,
  #    and those are the only record identity a transcript names. See the
  #    transform's docstring.
  - name: correction_inputs
    description: "Exchange prose plus the context ids that exchange retrieved"
    depends_on: [ref('raw_transcripts')]
    transform:
      type: python
      module: stel.transcripts.transforms.correction_inputs
      options:
        transcripts: raw_transcripts
    materialization: incremental
    tests:
      - not_null: [input_id, session_id, exchange_text, id_space]
      - unique: input_id

  # 2. The judgement. Deliberately narrow: only an explicit correction of a
  #    stated value counts. Agreement, restatement and a fresh question are
  #    not corrections, and a classifier that treats them as such manufactures
  #    ground truth nobody asserted.
  #
  #    Offline by default — the `deterministic` provider means this example
  #    runs in CI with no credentials and no spend. Labels worth trusting need
  #    a real provider.
  - name: drafted_corrections
    description: "Whether an exchange corrects a stated label, and to what"
    depends_on: [ref('correction_inputs')]
    llm:
      id_field: input_id
      input_field: exchange_text
      prompt: |
        You are reading two consecutive turns of a conversation between a
        human and an AI agent, to find cases where the human corrected a value
        the agent stated.

        Lines beginning `## [n]` are the human's own words. Everything else is
        the agent: its prose, and reduced one-line records of the tools it
        called. The agent makes a claim in the first turn; the human may
        correct it in the second.

        Return the corrected value only when the human explicitly asserts a
        different value for something the agent claimed — for example the
        agent says a filing is a 10-Q and the human replies that it is a 10-K.
        The value must come from the human's turn, never from the agent
        agreeing afterwards.

        Return an empty string for everything else. In particular:
        - the human agreeing, thanking, or restating what the agent said
        - the human asking a new question
        - the agent correcting itself with no human assertion
        - anything you are unsure about

        An absent label costs nothing. A wrong one becomes ground truth that
        a future model is scored against, so silence is the safe answer.
    fields:
      - name: corrected_label
        type: string
        description: "The value the human asserted, or empty if not a correction"
    materialization: incremental
    tests:
      - not_null: [input_id]

  # 3. The contract a promoted label set would be built from. One row per
  #    (record, asserted label), carrying the provenance a reviewer asks for
  #    first. `eval.expected` wants a key column and a label column, which is
  #    what `context_id` and `expected_label` are here.
  - name: classification_label_candidates
    description: "Candidate expected labels a human corrected, never promoted"
    depends_on: [ref('drafted_corrections'), ref('correction_inputs')]
    transform:
      type: sql
      path: sql/classification_label_candidates.sql
    # Full, not incremental, because this model *filters*: a row whose label
    # becomes empty -- a changed prompt, a different provider, an input that
    # went away -- simply stops appearing in staging, and an incremental
    # merge only replaces keys it can see. The stale candidate would sit
    # there indefinitely, and a stale candidate is one a human might promote
    # (PR #458 review). Rebuilding a filtered projection is cheap next to the
    # `llm:` step above it, which stays incremental.
    materialization: full
    tests:
      - not_null: [input_id, context_id, expected_label, id_space]
      - unique: input_id
