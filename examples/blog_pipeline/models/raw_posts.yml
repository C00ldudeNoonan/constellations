version: 2

models:
  - name: raw_posts
    description: "Parse frontmatter + body from markdown blog posts"
    source: ref('blog_posts')

    extraction:
      backend: markdown
      options:
        frontmatter_fields: [title, author, date, tags]
        include_body: true
        compute_word_count: true

    materialization: incremental

    fields:
      - name: title
        data_type: string
      - name: author
        data_type: string
      - name: date
        data_type: string
      - name: tags
        data_type: json
      - name: body
        data_type: string
      - name: word_count
        data_type: integer

    tests:
      - not_null: [title, author, date]
      - unique: source_path
