version: 2

models:
  - name: document_tokens
    description: "One row per non-space token in each economic document"
    depends_on: [ref('raw_documents')]
    transform:
      type: python
      module: stel.text.transforms.nlp_tokens
      options:
        document_id_field: economic_id
        text_field: text
        model: en_core_web_sm
        language: en
        batch_size: 32
        include_fields: [publisher, published_at]
        # Mixed-language corpus: replace `model`/`language` above with
        # `language_routing` (see "NLP providers and language routing" in
        # docs/reference.md). Each route needs its spaCy model installed.
        #   language_routing:
        #     language_field: lang          # or omit to detect from the text
        #     routes:
        #       en: {provider: spacy, model: en_core_web_sm}
        #       de: {provider: spacy, model: de_core_news_sm}
        #     on_undetected: skip
        #     on_unrouted: skip
    materialization: full
    tags: [economic_data, nlp, tokens]
    tests:
      - not_null: [token_id, document_id, token_index, token_text]
      - unique: token_id
