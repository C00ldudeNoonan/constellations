version: 2

# The exported markdown carries real headings — a Doc's own, or one per slide
# for a deck — so heading attribution gives every chunk its section.
models:
  - name: drive_chunks
    description: "Heading-attributed chunks of each Drive document"
    depends_on: [ref('drive_documents')]
    chunk:
      strategy: recursive
      text_field: body
      # Below a typical section's length, so a section starts its own chunk
      # and heading attribution names it. No overlap: a chunk is attributed
      # to the section where it *starts* (#343), and overlap would start every
      # chunk inside the previous section's tail, so headings never name the
      # chunk that actually holds their text.
      chunk_size: 400
      chunk_overlap: 0
      headings:
        pattern: '^#{1,6} (.+)$'
        column: section
    materialization: incremental
    tests:
      - not_null: [chunk_id, document_id, text, source_path]
      - unique: chunk_id
