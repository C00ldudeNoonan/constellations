version: 2

# The block contract `render_blocks` consumes. A connector's own tables map
# onto it with one SQL staging model (see the README); the fixture already
# has this shape.
models:
  - name: notion_blocks
    description: "Landed Notion blocks: page, parent block, sibling position, type, text"
    source: ref('notion_block_rows')
    extraction:
      backend: json
      options:
        fields:
          - block_id
          - page_id
          - parent_block_id
          - position
          - type
          - text
          - checked
          - language
    materialization: incremental
    fields:
      - name: block_id
        data_type: string
      - name: page_id
        data_type: string
      - name: parent_block_id
        data_type: string
      - name: position
        data_type: integer
      - name: type
        data_type: string
      - name: text
        data_type: string
      - name: checked
        data_type: boolean
      - name: language
        data_type: string
    tests:
      - not_null: [block_id, page_id, position, type]
      - unique: block_id
