version: 2

# The two relations an EL tool lands for Notion: pages and blocks. The
# fixture mirrors them one JSON object per file so the example runs with no
# warehouse setup. In production, point each source at the landed table and
# nothing downstream changes:
#
#   - name: notion_page_rows
#     path: warehouse://landed.notion_page
#     key_column: page_id
#   - name: notion_block_rows
#     path: warehouse://landed.notion_block
#     key_column: block_id
#
# tests/test_notion_landed_example.py runs exactly that swap over DuckDB
# tables and asserts the rendered documents are identical.
sources:
  - name: notion_page_rows
    description: "One row per Notion page: id, title, parent, database, properties"
    path: landed/notion_page
    file_pattern: "*.json"
    tags: [notion, landed]
  - name: notion_block_rows
    description: "One row per Notion block: id, page, parent block, position, type, text"
    path: landed/notion_block
    file_pattern: "*.json"
    tags: [notion, landed]
