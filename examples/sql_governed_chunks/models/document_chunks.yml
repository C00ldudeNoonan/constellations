version: 2

models:
  - name: document_chunks
    description: "Chunk rows extracted from JSON documents"
    source: ref('chunk_docs')
    extraction:
      backend: json
      options:
        fields: [chunk_id, doc_ref, text]
    materialization: full
    tags: [chunks]
    fields:
      - {name: chunk_id, data_type: string}
      - {name: doc_ref, data_type: string}
      - {name: text, data_type: string}
    tests:
      - not_null: [chunk_id, doc_ref]
      - unique: chunk_id
