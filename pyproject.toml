[project]
name = "stel"
version = "0.19.0"
description = "dbt for unstructured data — declarative pipelines for documents, text, and ML preprocessing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "pydantic>=2.7",
    "pyyaml>=6",
    "duckdb>=1.0",
    "polars>=1.0",
    "pyarrow>=16",
    "faker>=25",
    "anthropic>=0.40",
    "watchfiles>=0.21",
    "jinja2>=3.1",
    "cryptography>=50.0.0",
    # Not imported by stel. Declared for its floor: `anthropic` and
    # `watchfiles` both pull anyio into the *base* install, and neither
    # requires a version past the IDNA 2003 TLS certificate-spoofing advisory
    # (CVE-2026-63374). uv.lock fixes that for this repo and for CI; it has no
    # effect on a published wheel, whose Requires-Dist comes from here. Without
    # this floor an existing environment upgrading stel keeps the vulnerable
    # anyio, which is the one case the lock cannot reach (Codex review, #593).
    "anyio>=4.14.2",
]

[project.optional-dependencies]
# The storage client is not optional in practice: without it `to_arrow()`
# silently degrades to REST paging, which parses the whole result through
# Python objects before Arrow assembly — the load-phase multiplier behind
# the OOM in issue #383 — and warns only with a UserWarning from deep
# inside google-cloud.
bigquery = ["google-cloud-bigquery>=3.25", "google-cloud-bigquery-storage>=2.25"]
gcs = ["google-cloud-storage>=2.16"]
# Drive and Slides are four REST endpoints over an authorized session, so no
# discovery client: google-auth for ADC and the session, requests underneath.
gdrive = ["google-auth>=2.23", "requests>=2.31"]
vertex = ["google-genai>=1.28"]
lancedb = ["lancedb>=0.34,<0.35"]
# pyjwt[crypto] is for the network transport's JWT/JWKS token verifier
# (issue #392), httpx for the RFC 7662 introspection verifier beside it
# (issue #464). Both present transitively today; declared because a feature
# that authenticates callers must not depend on someone else's dependency
# graph.
mcp = ["mcp>=1.27,<2", "pyjwt[crypto]>=2.10", "httpx>=0.27"]
# soupsieve is beautifulsoup4's selector engine, not a stel import. Declared
# for the same reason as anyio above: bs4 requires only `soupsieve>1.2`, so
# nothing else floors it past the two polynomial-ReDoS advisories, one of
# which triggers on valid selectors (CVE-2026-86000).
html = ["beautifulsoup4>=4.12", "soupsieve>=2.9.0"]
pdf = ["pypdf>=6.18.0", "fpdf2>=2.7"]
pii = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
text = ["tiktoken>=0.7", "ftfy>=6.2", "langdetect>=1.0", "datasketch>=1.6"]
nlp = ["spacy>=3.8,<4"]
# scikit-learn>=1.3 ships HDBSCAN natively, so clustering/topic modeling needs
# no separate hdbscan dependency.
ml = ["scikit-learn>=1.3", "numpy>=1.26"]
all = [
    "google-cloud-bigquery>=3.25",
    "google-cloud-bigquery-storage>=2.25",
    "google-cloud-storage>=2.16",
    "google-auth>=2.23",
    "requests>=2.31",
    "google-genai>=1.28",
    "lancedb>=0.34,<0.35",
    "mcp>=1.27,<2",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "soupsieve>=2.9.0",
    "pypdf>=6.18.0",
    "fpdf2>=2.7",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "tiktoken>=0.7",
    "ftfy>=6.2",
    "langdetect>=1.0",
    "datasketch>=1.6",
    "spacy>=3.8,<4",
    "scikit-learn>=1.3",
    "numpy>=1.26",
]

[project.scripts]
stel = "stel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stel"]

[dependency-groups]
dev = [
    "pytest>=8",
    # `-n auto --dist loadfile` runs the suite across every core; CI does, and
    # the local loop can (AGENTS.md, Development workflow).
    "pytest-xdist>=3.6",
    "ruff>=0.5",
    "pip-audit>=2.7",
    "types-pyyaml",
    # parses the extras' requirement strings in test_optional_dependencies.py.
    # Declared rather than taken transitively from pytest, for the reason the
    # test itself exists (issue #597).
    "packaging>=24",
    # the bigquery/gcs extras, so adapter unit tests run against real client types
    "google-cloud-bigquery>=3.25",
    "google-cloud-storage>=2.16",
    "ty>=0.0.63",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "ANN", "PYI"]
# Legitimate Unicode (right single quote, em dash, smart quotes) in docstrings,
# tests, and examples isn't a typo — we deliberately use it for mojibake demos.
ignore = ["RUF001", "RUF002", "RUF003", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["ANN", "PYI"]
"tests/**/*.py" = ["ANN", "PYI"]

[tool.ty.src]
include = ["src/stel", "typecheck", "tests", "examples", "scripts"]

[tool.ty.rules]
missing-type-argument = "error"

[tool.pytest.ini_options]
# Test tiers (issue #518). `e2e` marks a file that runs a whole project or
# opens a retrieval store: ~80% of the suite's wall clock lives there, so
# `-m "not e2e"` is the fast local loop and CI still runs everything.
markers = [
    "e2e: runs a whole project or opens a retrieval store",
]
testpaths = ["tests"]
