<!DOCTYPE html>
<!-- GENERATED by `stel concept-cloud` (#255, #345). Self-contained: the export
     bundle is embedded below; the 3d-force-graph library loads from a CDN the
     first time the page is viewed (needs network then), degrading to a message
     if unreachable. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>stel star map</title>
  <style>
    :root {
      --bg: #05070f; --panel: rgba(13, 18, 32, 0.72); --fg: #dfe7f3;
      --muted: #7d8aa0; --accent: #6fb7ff; --line: rgba(159, 183, 218, 0.14);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; color: var(--fg);
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      /* Deep-space ground with faint nebula tints; the WebGL canvas renders
         transparent on top so the scene floats in this sky. */
      background:
        radial-gradient(1100px 700px at 78% 18%, rgba(64, 90, 160, 0.16), transparent 60%),
        radial-gradient(900px 600px at 15% 85%, rgba(96, 60, 140, 0.12), transparent 60%),
        radial-gradient(700px 500px at 40% 40%, rgba(40, 120, 130, 0.07), transparent 65%),
        var(--bg);
    }
    #graph { position: fixed; inset: 0; }
    header { position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; gap: 16px; align-items: center; padding: 12px 18px;
      background: linear-gradient(rgba(5,7,15,.85), transparent); }
    header h1 { font-size: 14px; font-weight: 600; margin: 0;
      letter-spacing: .14em; text-transform: uppercase; }
    header h1 .glyph { color: var(--accent); margin-right: 6px; }
    header h1 small { color: var(--muted); font-weight: 400;
      letter-spacing: .04em; text-transform: none; }
    #search { background: var(--panel); border: 1px solid var(--line);
      color: var(--fg); border-radius: 8px; padding: 6px 12px; width: 240px;
      backdrop-filter: blur(10px); outline: none; }
    #search:focus { border-color: rgba(111, 183, 255, .45); }
    #panel { position: fixed; top: 56px; left: 16px; z-index: 10; max-width: 264px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 14px; backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, .35); }
    #panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .12em;
      color: var(--muted); margin: 0 0 8px; }
    #colorby { width: 100%; background: rgba(5, 8, 16, .6);
      border: 1px solid var(--line); color: var(--fg); border-radius: 7px;
      padding: 5px 8px; margin-bottom: 10px; }
    .legend-item { display: flex; align-items: center; gap: 9px; margin: 4px 0;
      cursor: pointer; user-select: none; font-size: 13px; }
    .swatch { width: 9px; height: 9px; border-radius: 50%; flex: none;
      box-shadow: 0 0 6px 1px currentColor; }
    .legend-item.off { opacity: .3; }
    #filters { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
    .ctl { display: block; margin: 9px 0; font-size: 13px; cursor: pointer; }
    .ctl input[type="range"] { width: 100%; margin-top: 4px; accent-color: var(--accent); }
    .ctl input[type="checkbox"] { accent-color: var(--accent); margin-right: 6px; }
    .ctl .val { color: var(--muted); }
    #detail { position: fixed; bottom: 16px; left: 16px; z-index: 10; max-width: 330px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 14px; display: none; backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, .35); }
    #detail strong { letter-spacing: .02em; }
    #detail .k { color: var(--muted); }
    footer { position: fixed; bottom: 10px; right: 14px; z-index: 10;
      color: var(--muted); font-size: 11px; letter-spacing: .04em; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1><span class="glyph">✦</span>stel star map <small id="subtitle"></small></h1>
    <input id="search" type="search" placeholder="Search concepts…" autocomplete="off" />
  </header>
  <aside id="panel">
    <h2>Color by</h2>
    <select id="colorby"></select>
    <div id="legend"></div>
    <div id="filters">
      <h2>Filters</h2>
      <label class="ctl"><input type="checkbox" id="orphans"> Highlight orphans</label>
      <label class="ctl">
        Min frequency: <span class="val" id="minfreq-val">0</span>
        <input type="range" id="minfreq" min="0" max="100" value="0">
      </label>
      <label class="ctl"><input type="checkbox" id="lineage"> Lineage mode (dbt plane + beams)</label>
    </div>
  </aside>
  <aside id="detail"></aside>
  <div id="graph"></div>
  <footer>drag to orbit · scroll to zoom · click a star · lineage mode traces beams</footer>

  <!-- The 3d-force-graph library is inlined here at render time so the artifact
       is fully self-contained (works offline, no CDN). If it is ever stripped,
       the script below falls back to fetching it from a CDN. -->
  <script>/*__CONCEPT_CLOUD_LIB__*/</script>
  <script id="cc-data" type="application/json">__CONCEPT_CLOUD_DATA__</script>
  <script>
    "use strict";
    const CDN = "https://unpkg.com/3d-force-graph";
    const DATA = JSON.parse(document.getElementById("cc-data").textContent);
    document.getElementById("subtitle").textContent =
      "· " + DATA.project + " · " + DATA.concepts.length + " concepts";

    // Star-tinted categorical palette: bright enough to glow on deep space.
    const PALETTE = ["#7db8ff","#ffd76e","#8fe3a1","#ff8f85","#d8b4ff",
                     "#ffb36e","#9fd8ff","#ff9fce","#7fe0cc","#ecd06f"];
    // Retrieval heat reads as temperature, not as arbitrary categories.
    const HEAT_COLORS = { hot: "#ff8f85", warm: "#ffd76e", cold: "#9fd8ff",
                          never: "#5a6478" };
    const DIM = "#2b3644";  // deselected / receded
    // Known dbt resource kinds; anything else falls back to the neutral grey.
    const RESOURCE_COLOR = {
      source: "#8b98a9", model: "#3fb950", exposure: "#d2a8ff",
      seed: "#79c0ff", snapshot: "#ffa657", analysis: "#d2a8ff", metric: "#56d4bc",
    };

    // Color-by dimensions: the entity label plus every declared dimension
    // (#345). Each entry carries its ordered values and a value->color map.
    const labelValues =
      [...new Set(DATA.concepts.map(c => c.label || "—"))].sort();
    const DIMENSIONS = [
      { name: "label", title: "Entity type", values: labelValues,
        valueOf: n => n.label || "—" },
      ...(DATA.dimensions || []).map(d => ({
        name: d.name, title: d.name, values: [...d.values],
        valueOf: n => (n.dimensions || {})[d.name] || "—",
      })),
    ];
    for (const dim of DIMENSIONS) {
      dim.color = {};
      const heat = dim.values.every(v => v in HEAT_COLORS);
      dim.values.forEach((v, i) =>
        dim.color[v] = heat ? HEAT_COLORS[v] : PALETTE[i % PALETTE.length]);
      dim.color["—"] = dim.color["—"] || "#5a6478";
    }

    let colorBy = DIMENSIONS[0];
    const hidden = new Set();   // values of the CURRENT dimension toggled off
    let selected = null;        // currently selected node id
    let Graph = null;           // assigned once the library loads
    let highlightOrphans = false;
    let minFreq = 0;            // hide concepts below this mention frequency
    // Lineage mode (#345 Q4/Q5): OFF by default — the star map is the primary
    // view; toggling on drops the dbt plane in beneath and enables the beams.
    let lineageMode = false;

    // A node is an orphan when it has no *meaningful* edge — a concept-to-concept
    // relation or a DAG lineage edge. Cross-layer links to the linking model are
    // ignored, otherwise every concept would connect and none could be orphaned.
    const degree = {};
    for (const e of DATA.concept_edges) {
      degree[e.source] = (degree[e.source] || 0) + 1;
      degree[e.target] = (degree[e.target] || 0) + 1;
    }
    for (const e of DATA.dag_plane.edges) {
      degree[e.from] = (degree[e.from] || 0) + 1;
      degree[e.to] = (degree[e.to] || 0) + 1;
    }
    const isOrphan = id => !(degree[id] > 0);
    const maxFreq = Math.max(1, ...DATA.concepts.map(c => c.frequency));

    // The library-independent UI (subtitle, legend, filters) renders immediately;
    // the 3d-force-graph library loads non-blockingly so a slow/unreachable CDN
    // degrades to a message instead of hanging or blanking the page.
    buildColorBy();
    buildLegend();
    buildControls();
    loadForceGraph().then(buildGraph).catch(() => showFallback(
      "Couldn't load the 3d-force-graph library (the artifact fetches it from a " +
      "CDN on first view — this needs network). Concept values are listed on the left."
    ));

    function loadForceGraph() {
      return new Promise((resolve, reject) => {
        if (typeof ForceGraph3D !== "undefined") return resolve();
        const s = document.createElement("script");
        s.src = CDN;
        s.onload = () => typeof ForceGraph3D !== "undefined"
          ? resolve() : reject(new Error("missing global"));
        s.onerror = () => reject(new Error("network"));
        document.head.appendChild(s);
        setTimeout(() =>
          typeof ForceGraph3D === "undefined" && reject(new Error("timeout")), 10000);
      });
    }

    function showFallback(msg) {
      document.getElementById("graph").innerHTML =
        '<div style="max-width:520px;margin:22vh auto;padding:0 24px;' +
        'color:var(--muted);text-align:center;line-height:1.6">' + msg + "</div>";
    }

    function buildColorBy() {
      const select = document.getElementById("colorby");
      DIMENSIONS.forEach((dim, i) => {
        const option = document.createElement("option");
        option.value = String(i);
        option.textContent = dim.title;
        select.appendChild(option);
      });
      select.addEventListener("change", () => {
        colorBy = DIMENSIONS[Number(select.value)];
        hidden.clear();           // the hidden set is per-dimension values
        buildLegend();
        if (Graph) fullRefresh();
      });
    }

    function buildLegend() {
      const legend = document.getElementById("legend");
      legend.innerHTML = "";
      colorBy.values.forEach(v => {
        const row = document.createElement("div");
        row.className = "legend-item";
        row.innerHTML =
          `<span class="swatch" style="background:${colorBy.color[v]};color:${colorBy.color[v]}"></span>${v}`;
        row.onclick = () => {
          if (hidden.has(v)) hidden.delete(v); else hidden.add(v);
          row.classList.toggle("off", hidden.has(v));
          if (Graph) fullRefresh();
        };
        legend.appendChild(row);
      });
    }

    function buildControls() {
      const orphans = document.getElementById("orphans");
      orphans.addEventListener("change", () => {
        highlightOrphans = orphans.checked;
        if (Graph) fullRefresh();
      });
      const slider = document.getElementById("minfreq");
      const sliderVal = document.getElementById("minfreq-val");
      slider.max = String(maxFreq);
      slider.addEventListener("input", () => {
        minFreq = Number(slider.value);
        sliderVal.textContent = slider.value;
        if (Graph) fullRefresh();
      });
      const lineage = document.getElementById("lineage");
      lineage.addEventListener("change", () => {
        lineageMode = lineage.checked;
        if (Graph) fullRefresh();
      });
    }

    // Set once buildGraph runs; refreshes both the library-driven accessors
    // and the sprite tints the library does not know about.
    let fullRefresh = () => {};

    function showDetail(node) {
      const el = document.getElementById("detail");
      if (!node) { el.style.display = "none"; return; }
      el.style.display = "block";
      if (node.kind === "concept") {
        const dims = Object.entries(node.dimensions || {})
          .map(([k, v]) => `<span class="k">${k}</span> ${v}`).join(" · ");
        el.innerHTML = `<strong>${node.name}</strong><br>` +
          `<span class="k">id</span> ${node.id}<br>` +
          `<span class="k">type</span> ${node.label} · ` +
          `<span class="k">freq</span> ${node.frequency} · ` +
          `<span class="k">link</span> ${node.link_status}` +
          (dims ? `<br>${dims}` : "");
      } else {
        el.innerHTML = `<strong>${node.name}</strong><br>` +
          `<span class="k">dbt ${node.resource_type}</span><br>${node.id}`;
      }
    }

    // ── star rendering ──────────────────────────────────────────────────────
    // The standalone 3d-force-graph bundle exposes the THREE namespace; when it
    // is present, concepts render as glowing star sprites with sky-chart
    // labels, the scene gets depth fog, and a faint starfield drifts behind
    // everything. Without it (an exotic build), the default spheres remain.
    function three() { return window.THREE; }

    function makeGlowTexture(THREE) {
      // A white radial glow: bright core, soft halo. SpriteMaterial's color
      // tints it per node, so one texture serves every star.
      const size = 128;
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext("2d");
      const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
      g.addColorStop(0.0, "rgba(255,255,255,1)");
      g.addColorStop(0.12, "rgba(255,255,255,.95)");
      g.addColorStop(0.3, "rgba(255,255,255,.32)");
      g.addColorStop(0.65, "rgba(255,255,255,.07)");
      g.addColorStop(1.0, "rgba(255,255,255,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
      const texture = new THREE.Texture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    function makeLabelSprite(THREE, text) {
      // Sky-chart style: small caps, letter-spaced, faint blue-white.
      const scaleUp = 3;                     // supersample for crisp text
      const font = `${11 * scaleUp}px -apple-system, "Segoe UI", sans-serif`;
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      ctx.font = font;
      const label = text.toUpperCase();
      const spacing = 2 * scaleUp;
      const width = ctx.measureText(label).width + spacing * label.length + 8;
      canvas.width = Math.ceil(width);
      canvas.height = 16 * scaleUp;
      ctx.font = font;
      ctx.fillStyle = "rgba(205, 220, 240, 0.85)";
      ctx.textBaseline = "middle";
      let x = 4;
      for (const ch of label) {
        ctx.fillText(ch, x, canvas.height / 2);
        x += ctx.measureText(ch).width + spacing;
      }
      const texture = new THREE.Texture(canvas);
      texture.needsUpdate = true;
      const material = new THREE.SpriteMaterial({
        map: texture, transparent: true, depthWrite: false,
      });
      const sprite = new THREE.Sprite(material);
      sprite.scale.set(canvas.width / (6 * scaleUp), canvas.height / (6 * scaleUp), 1);
      return sprite;
    }

    function addStarfield(THREE, scene) {
      // Two faint shells of distant stars, drifting at slightly different
      // speeds — the "slightly moving faded star background". Far enough out
      // that the graph never intersects them; additive blending keeps them
      // luminous but unobtrusive.
      const shells = [];
      for (const [count, radius, size, opacity] of
           [[1400, 2600, 3.2, 0.28], [700, 1700, 2.2, 0.18]]) {
        const positions = new Float32Array(count * 3);
        for (let i = 0; i < count; i++) {
          // Uniform on a sphere shell with a little radial jitter.
          const u = Math.random() * 2 - 1;
          const theta = Math.random() * Math.PI * 2;
          const r = radius * (0.85 + Math.random() * 0.3);
          const s = Math.sqrt(1 - u * u);
          positions[i * 3] = r * s * Math.cos(theta);
          positions[i * 3 + 1] = r * u;
          positions[i * 3 + 2] = r * s * Math.sin(theta);
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        const material = new THREE.PointsMaterial({
          color: 0xcfe0f5, size, transparent: true, opacity,
          sizeAttenuation: false, depthWrite: false,
        });
        const points = new THREE.Points(geometry, material);
        scene.add(points);
        shells.push(points);
      }
      let last = performance.now();
      (function drift(now) {
        const dt = Math.min(100, now - last); last = now;
        shells[0].rotation.y += dt * 0.0000045;
        shells[1].rotation.y -= dt * 0.0000030;
        shells[1].rotation.x += dt * 0.0000012;
        requestAnimationFrame(drift);
      })(last);
    }

    function buildGraph() {
      // One graph, two layers: fixed DAG-plane nodes (y=0 grid, lineage mode
      // only) and concept nodes. Concepts with baked positions (#345) are
      // PINNED to them — position IS the meaning, and letting the force
      // simulation relax them erases in seconds the semantics the projection
      // computed. Concepts without positions still simulate freely. The
      // vertical offset lifts the cloud above the plane so lineage mode reads
      // as sky-over-ground.
      const Y_OFFSET = 160;
      const nodes = [];
      const links = [];
      const dagNodes = DATA.dag_plane.nodes;
      const cols = Math.max(1, Math.ceil(Math.sqrt(dagNodes.length)));
      const SPREAD = 60;
      dagNodes.forEach((n, i) => nodes.push({
        id: n.id, name: n.label, kind: "dag", resource_type: n.resource_type, val: 6,
        fx: (i % cols - cols / 2) * SPREAD, fz: (Math.floor(i / cols) - cols / 2) * SPREAD,
        fy: 0,
      }));
      DATA.dag_plane.edges.forEach(e =>
        links.push({ source: e.from, target: e.to, kind: "dag" }));
      // Sky-chart labels go on the brightest stars; a chart that names every
      // faint one is unreadable.
      const labelled = new Set(
        [...DATA.concepts].sort((a, b) => b.frequency - a.frequency)
          .slice(0, 14).map(c => c.canonical_id));
      DATA.concepts.forEach(c => {
        const node = {
          id: c.canonical_id, name: c.display, kind: "concept", label: c.label || "—",
          val: c.frequency, link_status: c.link_status, frequency: c.frequency,
          dimensions: c.dimensions || {}, labelled: labelled.has(c.canonical_id),
        };
        if (c.position) {
          node.fx = c.position.x;
          node.fy = c.position.y + Y_OFFSET;
          node.fz = c.position.z;
        } else {
          node.y = Y_OFFSET - 40 + Math.random() * 80;
        }
        nodes.push(node);
      });
      DATA.concept_edges.forEach(e => links.push({
        source: e.source, target: e.target, kind: "concept",
        relation_type: e.relation_type, method: e.method, directed: e.directed,
      }));
      DATA.cross_layer_edges.forEach(e => links.push({
        source: e.concept, target: e.dag_node, kind: "cross",
      }));

      const neighbors = new Map();
      links.forEach(l => {
        (neighbors.get(l.source) || neighbors.set(l.source, new Set()).get(l.source)).add(l.target);
        (neighbors.get(l.target) || neighbors.set(l.target, new Set()).get(l.target)).add(l.source);
      });
      const linkKey = l => (l.source.id ?? l.source) + " " + (l.target.id ?? l.target);
      const touching = new Set();
      function recomputeTouching() {
        touching.clear();
        if (!selected) return;
        links.forEach(l => {
          const s = l.source.id ?? l.source, t = l.target.id ?? l.target;
          if (s === selected || t === selected) touching.add(linkKey(l));
        });
      }

      function conceptColor(n) {
        if (highlightOrphans) return isOrphan(n.id) ? "#ff5c5c" : DIM;
        const base = colorBy.color[colorBy.valueOf(n)] || "#5a6478";
        if (!selected) return base;
        if (n.id === selected || (neighbors.get(selected) || new Set()).has(n.id))
          return base;
        return DIM;
      }

      function nodeVisible(n) {
        if (n.kind === "dag") return lineageMode;
        if (hidden.has(colorBy.valueOf(n))) return false;
        return n.frequency >= minFreq;
      }

      const THREE = three();
      const glowTexture = THREE ? makeGlowTexture(THREE) : null;

      function starObject(n) {
        // Concepts render as glowing star sprites; the DAG plane keeps the
        // library's default geometry so ground and sky read differently.
        if (!THREE || n.kind !== "concept") return undefined;
        const group = new THREE.Group();
        const material = new THREE.SpriteMaterial({
          map: glowTexture, transparent: true, depthWrite: false,
          color: conceptColor(n),
        });
        const star = new THREE.Sprite(material);
        const scale = 7 + Math.sqrt(n.frequency) * 2.2;
        star.scale.set(scale, scale, 1);
        group.add(star);
        n.__starMaterial = material;
        if (n.labelled) {
          const label = makeLabelSprite(THREE, n.name);
          label.position.set(0, -(scale * 0.55 + 3), 0);
          group.add(label);
          n.__labelMaterial = label.material;
        }
        return group;
      }

      Graph = ForceGraph3D()(document.getElementById("graph"))
        // Transparent scene: the page's nebula gradient is the sky.
        .backgroundColor("rgba(0,0,0,0)")
        .graphData({ nodes, links })
        .nodeThreeObject(starObject)
        .nodeLabel(n => n.kind === "concept"
          ? `${n.name} · ${n.label} · freq ${n.frequency}`
          + (isOrphan(n.id) ? " · orphan" : "")
          : `${n.name} · ${n.resource_type}`
          + (isOrphan(n.id) ? " · orphan" : ""))
        .nodeVal(n => n.kind === "dag" ? 6 : Math.max(2, n.val))
        .nodeVisibility(nodeVisible)
        .nodeColor(n => n.kind === "dag"
          ? (RESOURCE_COLOR[n.resource_type] || "#8b98a9") : conceptColor(n))
        .linkVisibility(l => {
          const s = l.source, t = l.target;
          if (l.kind !== "concept" && !lineageMode) return false;
          if (typeof s === "object" && (!nodeVisible(s) || !nodeVisible(t))) return false;
          return l.kind === "cross"
            ? (selected ? touching.has(linkKey(l)) : false) : true;
        })
        // Constellation lines: faint silver until a star is chosen, then its
        // own constellation brightens and the rest recede.
        .linkOpacity(0.55)
        .linkColor(l => {
          if (l.kind === "cross") return "#ffcb47";      // amber beam
          if (l.kind === "dag") return "#5d6a7d";        // plane lineage (subdued)
          return selected
            ? (touching.has(linkKey(l)) ? "#cfe3ff" : "#232c3a")
            : "#8fa5c4";
        })
        .linkWidth(l => l.kind === "cross" ? 2.2
          : (l.kind === "concept" ? (selected && touching.has(linkKey(l)) ? 1.6 : 0.7) : 0.8))
        .linkDirectionalArrowLength(l => l.kind === "concept" && l.directed ? 3 : 0)
        .linkDirectionalParticles(l =>
          l.kind === "cross" && touching.has(linkKey(l)) ? 3 : 0)
        .onNodeClick(node => {
          selected = (selected === node.id) ? null : node.id;
          recomputeTouching(); showDetail(selected ? node : null); fullRefresh();
        })
        .onBackgroundClick(() => {
          selected = null; recomputeTouching(); showDetail(null); fullRefresh();
        });

      if (THREE) {
        // Depth cue: far stars fade toward the sky color.
        Graph.scene().fog = new THREE.FogExp2(0x05070f, 0.00075);
        addStarfield(THREE, Graph.scene());
      }

      fullRefresh = () => {
        // Library-driven accessors...
        Graph.nodeColor(Graph.nodeColor()).nodeVisibility(Graph.nodeVisibility())
             .linkVisibility(Graph.linkVisibility()).linkColor(Graph.linkColor())
             .linkWidth(Graph.linkWidth())
             .linkDirectionalParticles(Graph.linkDirectionalParticles());
        // ...plus the sprite tints the library does not manage.
        for (const n of nodes) {
          if (n.__starMaterial) n.__starMaterial.color.set(conceptColor(n));
          if (n.__labelMaterial) {
            const receded = selected && n.id !== selected &&
              !(neighbors.get(selected) || new Set()).has(n.id);
            n.__labelMaterial.opacity = receded ? 0.15 : 1;
          }
        }
      };

      // 3d-force-graph sizes its canvas from the container once at init; if the
      // container hasn't laid out yet the canvas is 0×0 and nothing draws. Pin it
      // to the viewport and keep it in sync on resize.
      const resizeGraph = () =>
        Graph.width(window.innerWidth).height(window.innerHeight);
      resizeGraph();
      window.addEventListener("resize", resizeGraph);

      // Entry point (#345): open on something specific, not the whole
      // hairball. The hottest retrieved concept wins (what agents actually ask
      // about); otherwise the most frequent one.
      function entryNode() {
        const concepts = nodes.filter(n => n.kind === "concept");
        const hot = concepts.filter(n => (n.dimensions || {}).retrieval === "hot");
        const pool = hot.length ? hot : concepts;
        return pool.reduce(
          (best, n) => (!best || n.frequency > best.frequency ? n : best), null);
      }
      let fitted = false;
      Graph.onEngineStop(() => {
        if (fitted) return;
        fitted = true;
        Graph.zoomToFit(400, 60);
        const entry = entryNode();
        if (entry && entry.fx !== undefined) {
          selected = entry.id; recomputeTouching(); showDetail(entry); fullRefresh();
          setTimeout(() => Graph.cameraPosition(
            { x: entry.fx, y: entry.fy + 40, z: entry.fz + 140 }, entry, 900), 500);
        }
      });

      document.getElementById("search").addEventListener("input", e => {
        const q = e.target.value.trim().toLowerCase();
        if (!q) { selected = null; recomputeTouching(); showDetail(null); fullRefresh(); return; }
        const hit = nodes.find(n => n.kind === "concept" &&
          (n.name.toLowerCase().includes(q) || n.id.toLowerCase().includes(q)));
        if (hit) {
          selected = hit.id; recomputeTouching(); showDetail(hit);
          const x = hit.fx ?? hit.x, y = hit.fy ?? hit.y, z = hit.fz ?? hit.z;
          if (x !== undefined)
            Graph.cameraPosition({ x, y: y + 30, z: z + 80 }, hit, 600);
          fullRefresh();
        }
      });
    }
  </script>
</body>
</html>
