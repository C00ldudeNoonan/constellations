version: 2

models:
  - name: context_entity_edges
    description: "Which systems are related, and the passage that says so, for agents over MCP"
    depends_on: [ref('entity_relations'), ref('entity_links'), ref('document_chunks')]
    transform:
      type: python
      module: transforms.context_entity_edges
    agent_context:
      contract: agent_context/v1
      grain: context_entity_edges
    materialization: full
    tests:
      - not_null: [context_entity_edge_id, context_id, subject_entity_id, object_entity_id]
      - unique: context_entity_edge_id
