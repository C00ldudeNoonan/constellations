__PROJECT_NAME__:
  target: dev
  outputs:
    dev:
      warehouse:
        type: duckdb
        path: ./target/stel.duckdb
        schema: __PROJECT_NAME__

    # MotherDuck is the same DuckDB engine, managed. Uncomment and run
    # `stel run --target motherduck` with MOTHERDUCK_TOKEN set in your
    # environment; never put the token value in this file.
    # motherduck:
    #   warehouse:
    #     type: duckdb
    #     path: md:__PROJECT_NAME__
    #     token: "{{ env_var('MOTHERDUCK_TOKEN') }}"
    #     schema: __PROJECT_NAME__
