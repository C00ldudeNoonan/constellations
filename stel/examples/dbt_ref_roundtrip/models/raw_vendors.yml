version: 2

models:
  - name: raw_vendors
    description: >
      Project synthetic vendor-spend documents into a typed table — the
      forward (stel -> dbt) half of the round trip (#177).
    source: ref('vendor_docs')
    extraction:
      backend: json
      options:
        fields: [vendor, spend]
    materialization: full
    tags: [roundtrip]

    fields:
      - name: vendor
        data_type: string
      - name: spend
        data_type: float

    tests:
      - not_null: [vendor, spend]
      - unique: vendor
