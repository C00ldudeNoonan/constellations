version: 2

models:
  - name: alias_embeddings
    description: "Alias surface forms embedded with the same model as the mentions"
    depends_on: [ref('entity_aliases')]

    embed:
      provider: deterministic
      model: deterministic-v1
      text_field: alias
      id_field: alias_id
      vector_field: embedding
      dimensions: 8
      batch_size: 128

    materialization: incremental

    tests:
      - not_null: [alias_id, alias, entity_namespace, canonical_id, embedding]
      - unique: alias_id
