version: 2

models:
  - name: document_entities
    description: "One row per named entity without retaining matched text"
    depends_on: [ref('raw_documents')]
    transform:
      type: python
      module: stel.text.transforms.nlp_entities
      options:
        document_id_field: economic_id
        text_field: text
        model: en_core_web_sm
        language: en
        batch_size: 32
        include_fields: [publisher, published_at]
        include_text: false
    materialization: full
    tags: [economic_data, nlp, entities]
    tests:
      - not_null: [entity_id, document_id, entity_index, label]
      - unique: entity_id
