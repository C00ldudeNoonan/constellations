version: 2

models:
  - name: entity_links
    description: "Mentions resolved to canonical agency and country identifiers"
    depends_on: [ref('entity_mentions'), ref('entity_aliases')]
    transform:
      type: python
      module: stel.text.transforms.link_entities
      options:
        mentions: entity_mentions
        aliases: entity_aliases
    materialization: full
    tags: [economic_data, entity_links]
    tests:
      - not_null: [entity_link_id, mention_id, document_id, status]
      - unique: entity_link_id
      - accepted_values:
          column: status
          values: [matched, ambiguous, unmatched]
