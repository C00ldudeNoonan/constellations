version: 2

models:
  - name: chunk_embeddings
    description: "Offline deterministic embeddings for governed passages"
    depends_on: [ref('document_chunks')]
    embed:
      provider: deterministic
      model: deterministic-v1
      text_field: text
      id_field: context_id
      vector_field: embedding
      dimensions: 8
      batch_size: 128
    materialization: full
    tests:
      - not_null: [context_id, embedding]
      - unique: context_id
