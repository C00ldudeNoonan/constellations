version: 2

models:
  - name: chunk_search
    description: "Public local search index over the example document chunks"
    depends_on: [ref('chunk_embeddings')]
    materialization: incremental
    tags: [retrieval, rag]

    search:
      access: public
      store: local
      collection: document_chunks
      id_field: chunk_id
      document_id_field: document_id
      chunk_id_field: chunk_id
      text_fields: [text]
      return_text_fields: [text]
      vector:
        field: embedding
        dimensions: 8
        metric: cosine
        search: exact
        embedding: inherit
      full_text:
        fields: [text]
      attributes:
        - name: source_uri
          data_type: string
          filter_role: user
          returned: true
      query:
        modes: [vector, text, filter]
        consistency: strong
      on_index_change: fail
      batch_size: 100

    retrieval_tests:
      - name: chunk_search_quality
        golden_set: ref('chunk_search_golden')
        mode: text
        at: [1, 2]
        thresholds:
          recall_at_2: {min: 1.0, severity: error}
          mrr_at_1: {min: 0.5, severity: error}
          ndcg_at_2: {min: 0.5, severity: warn}
      # Deliberately mislabeled golden query (#137 acceptance criterion: an
      # intentionally degraded configuration that fails). `stel eval` on
      # this project always reports one failing test here — see the example
      # README for what that demonstrates.
      - name: chunk_search_quality_regression_demo
        golden_set: ref('chunk_search_golden_degraded')
        mode: text
        at: [1]
        thresholds:
          recall_at_1: {min: 1.0, severity: error}
