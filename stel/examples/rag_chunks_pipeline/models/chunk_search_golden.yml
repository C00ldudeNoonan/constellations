version: 2

models:
  - name: chunk_search_golden
    description: "Hand-labeled query/relevance golden set for chunk_search (#137)"
    source: ref('raw_golden_queries')
    extraction:
      backend: json
      options:
        fields: [query_id, query_text, relevant_ids]
    materialization: full
    tags: [retrieval, eval]
    fields:
      - {name: query_id, data_type: string}
      - {name: query_text, data_type: string}
      - {name: relevant_ids, data_type: json}
    tests:
      - not_null: [query_id, query_text]
      - unique: query_id

  - name: chunk_search_golden_degraded
    description: >-
      One deliberately mislabeled golden query, feeding the
      chunk_search_quality_regression_demo retrieval test so `stel eval`
      demonstrably fails — proving the mechanism catches a real mismatch
      between labeled and retrieved relevance, not just runs successfully.
    source: ref('raw_golden_queries_degraded')
    extraction:
      backend: json
      options:
        fields: [query_id, query_text, relevant_ids]
    materialization: full
    tags: [retrieval, eval]
    fields:
      - {name: query_id, data_type: string}
      - {name: query_text, data_type: string}
      - {name: relevant_ids, data_type: json}
    tests:
      - not_null: [query_id, query_text]
      - unique: query_id
