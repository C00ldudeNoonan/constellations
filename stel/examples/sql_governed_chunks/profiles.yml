sql_governed_chunks:
  target: dev
  outputs:
    dev:
      warehouse:
        type: duckdb
        path: ./target/stel.duckdb
        schema: stel

    # MotherDuck is the same DuckDB adapter over the network (issue #186).
    # `stel run --target motherduck` with MOTHERDUCK_TOKEN set in the
    # environment. No credentials are committed here.
    motherduck:
      warehouse:
        type: duckdb
        path: md:sql_governed_chunks
        token: "{{ env_var('MOTHERDUCK_TOKEN') }}"
        schema: stel
