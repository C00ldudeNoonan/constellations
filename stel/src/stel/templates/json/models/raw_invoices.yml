version: 2

models:
  - name: raw_invoices
    description: "Project synthetic invoice JSON into a typed table"
    source: ref('vendor_invoices')

    extraction:
      backend: json
      options:
        fields: [invoice_id, vendor, issue_date, line_items, total, currency]

    materialization: incremental

    fields:
      - name: invoice_id
        data_type: string
      - name: vendor
        data_type: string
      - name: issue_date
        data_type: string
      - name: line_items
        data_type: json
      - name: total
        data_type: float
      - name: currency
        data_type: string

    tests:
      - not_null: [vendor, total]
      - unique: invoice_id
